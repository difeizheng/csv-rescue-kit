[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "csv-rescue-kit"
version = "0.1.0"
description = "Auditable CSV cleanup with a before-and-after report"
requires-python = ">=3.10"
dependencies = ["openpyxl>=3.1"]

[project.scripts]
csv-rescue = "csv_rescue:main"
excel-consolidate = "excel_consolidate:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
